<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML Practice 6 - Tables</title>
<style
   type="text/css">
   table {
   margin: 0 auto;
   width: 550px;
   }
   td, th {
   border: 1px solid black;
   padding: 5px;
   }
   .center_schedule {
      text-align: center;
      margin: 0 auto;
      width: 550px;
   }
   .caption {
      color: #003300;
      font-weight: bold;
      font-size: 1.2em;
   }
   .courses {
      width: 25%;
      background-color: #cccc;
   }
   .days{
      background-color: #99FF66;
   }
</style>
</head>

<body>

<div class="center_schedule">
<table>
   <caption class="caption">My Class Schedule</caption>
   <colgroup class="courses"></colgroup>
	<tr>
      <th>Courses</th>
      <th class="days">Monday</th>
      <th class="days">Tuesday</th>
      <th class="days">Wednesday</th>
      <th class="days">Thursday</th>
      <th class="days">Friday</th>
   </tr>
   <tr>
      <th class=>INFO 1120</th>
      <td>&nbsp;</td>
      <td>9-11</td>
      <td>&nbsp;</td>
      <td>9-11</td>
      <td rowspan="2">&nbsp;</td>
   </tr>
   <tr>
      <th>MATH 1010</th>
      <td colspan="4">12-1</td>
   </tr>
   <tr>
      <th>INFO 2420</th>
      <td colspan="5">Online Available 24/7</td>
   </tr>
</table>
</div>



</body>
</html>
